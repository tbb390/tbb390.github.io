<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f2f6fb">
  <title>每日学习记录</title>

  <!-- 所有每日页面共用的样式 -->
  <link rel="stylesheet" href="../assets/daily-study.css">
</head>

<body>
  <main class="container">
    <article class="card">
      <header class="article-header">
        <h1>📝 每日学习记录</h1>

        <div class="meta">
          <span>📅 日期：2026年__月__日</span>
          <span>⏱️ 时长：__小时</span>
          <span>📚 主题：填写今日主题</span>
        </div>
      </header>

      <section class="section">
        <h2 class="section-title">🎯 今日目标</h2>
        <div class="content-box">
          <p>今天计划完成什么？写下具体的学习目标。</p>
        </div>
      </section>

      <section class="section">
        <h2 class="section-title">📖 学习记录</h2>
        <div class="content-box">
          <p>记录今天学习的内容、完成的章节或练习。</p>
        </div>
      </section>

      <section class="section">
        <h2 class="section-title">💡 关键理解</h2>
        <div class="content-box">
          <p>记录重要概念、自己的理解、收获或新的发现。</p>
        </div>
      </section>

      <section class="section">
        <h2 class="section-title">🛠️ 实践与产出</h2>
        <div class="content-box">
          <p>记录完成的代码、题目、笔记、实验或其他成果。</p>
        </div>
      </section>

      <section class="section">
        <h2 class="section-title">🔍 问题与复盘</h2>
        <div class="content-box">
          <p>今天遇到了什么困难？哪些内容还需要继续理解？</p>
        </div>
      </section>

      <section class="section">
        <h2 class="section-title">➡️ 明日计划</h2>
        <div class="content-box">
          <p>写下下一步准备学习或完成的事情。</p>
        </div>
      </section>

      <!-- 配图可选：修改为实际图片路径；不需要时删除整个 figure -->
      <figure class="study-image">
        <img src="../prtsc/替换为图片文件名.png" alt="今日学习记录配图">
        <figcaption>图片说明（可选）</figcaption>
      </figure>

      <hr>

      <a href="../index.html" class="back-link">← 返回学习主页</a>
    </article>
  </main>
</body>
</html>
