<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<title>个人学习成长记录</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<style>

*{
    box-sizing:border-box;
}


body{

    margin:0;

    padding:40px 20px;

    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Microsoft YaHei",
    sans-serif;

    background:
    linear-gradient(180deg,#f5f7fa,#ffffff);

    color:#333;

}



.container{

    max-width:1000px;

    margin:auto;

}



.header{

    background:
  linear-gradient(
    90deg,
    rgba(255, 255, 255, 0.98) 0%,
    rgba(255, 255, 255, 0.92) 42%,
    rgba(255, 255, 255, 0.18) 100%
  ),
  url("prtsc/header.png") right center / cover no-repeat,
  #fff;

    padding:35px;

    border-radius:20px;

    margin-bottom:35px;

    box-shadow:
    0 8px 25px rgba(0,0,0,.06);

}


.header h1{

    margin:0;

    font-size:32px;

}


.header p{

    margin-top:12px;

    color:#666;

    line-height:1.7;

}




.section-title{

    font-size:24px;

    font-weight:600;

    margin:35px 0 20px;

}





.roadmap-grid{

    display:grid;

    grid-template-columns:
    repeat(auto-fill,minmax(220px,1fr));

    gap:20px;

}



.roadmap-card{

    background:white;

    border-radius:18px;

    padding:22px;

    text-decoration:none;

    color:#222;

    box-shadow:
    0 8px 25px rgba(0,0,0,.06);

    transition:.2s;

}


.roadmap-card:hover{

    transform:translateY(-4px);

    box-shadow:
    0 12px 30px rgba(0,0,0,.1);

}



.title{

    font-size:18px;

    font-weight:600;

    margin-bottom:10px;

}



.desc{

    font-size:14px;

    color:#666;

    line-height:1.6;

}




/* 搜索 */

#searchBox{

    width:100%;

    padding:14px 18px;

    margin-bottom:25px;

    border-radius:14px;

    border:1px solid #ddd;

    font-size:15px;

    outline:none;

    background:white;

}


#searchBox:focus{

    border-color:#777;

}





/* Day */

.day-list{

    display:grid;

    grid-template-columns:
    repeat(auto-fill,minmax(180px,1fr));

    gap:18px;

}



.day-card{

    background:white;

    border-radius:15px;

    padding:18px;

    box-shadow:
    0 6px 20px rgba(0,0,0,.05);

    transition:.2s;

}



.day-card:hover{

    transform:translateY(-4px);

    box-shadow:
    0 12px 30px rgba(0,0,0,.1);

}



.day-card a{

    text-decoration:none;

    color:#333;

}



.day-card strong{

    font-size:16px;

}



.day-card span{

    display:block;

    margin-top:8px;

    font-size:13px;

    color:#777;

    line-height:1.5;

}



.empty{

    background:white;

    padding:25px;

    border-radius:15px;

    text-align:center;

    color:#888;

}



footer{

    margin-top:50px;

    text-align:center;

    font-size:13px;

    color:#999;

}

/* 统一标题和区块层次 */
.section-title {
  position: relative;
  padding-left: 14px;
}

.section-title::before {
  content: "";
  position: absolute;
  left: 0;
  top: 5px;
  bottom: 5px;
  width: 4px;
  border-radius: 4px;
  background: linear-gradient(180deg, #4388e6, #62c5c2);
}

/* 学习路线卡片：轻微色彩区分 */
.roadmap-card {
  background:
    linear-gradient(145deg, rgba(239, 246, 255, 0.72), transparent 62%),
    #fff;
}

.roadmap-card:nth-child(4n + 2) {
  background:
    linear-gradient(145deg, rgba(236, 249, 248, 0.8), transparent 62%),
    #fff;
}

.roadmap-card:nth-child(4n + 3) {
  background:
    linear-gradient(145deg, rgba(244, 241, 255, 0.8), transparent 62%),
    #fff;
}

.roadmap-card:nth-child(4n) {
  background:
    linear-gradient(145deg, rgba(238, 245, 255, 0.86), transparent 62%),
    #fff;
}

/* 日记卡片：突出日期编号，内容保持清爽 */
.day-card {
  position: relative;
  overflow: hidden;
  background:
    linear-gradient(155deg, #fff 62%, #f5f9ff 100%);
}

.day-card::after {
  content: "";
  position: absolute;
  top: 0;
  right: 0;
  width: 44px;
  height: 44px;
  border-radius: 0 0 0 44px;
  background: rgba(78, 144, 226, 0.08);
  pointer-events: none;
}

.day-card strong {
  position: relative;
  z-index: 1;
  color: #2e6fbd;
}

.day-card a:hover strong {
  color: #174f91;
}

/* 搜索框聚焦时和页面蓝色强调色统一 */
#searchBox:focus {
  border-color: #73a8e8;
  box-shadow: 0 0 0 4px rgba(67, 136, 230, 0.12);
}

/* 页脚增加一点收束感 */
footer {
  position: relative;
  padding-top: 26px;
}

footer::before {
  content: "";
  position: absolute;
  top: 0;
  left: 50%;
  width: 48px;
  height: 2px;
  transform: translateX(-50%);
  border-radius: 2px;
  background: linear-gradient(90deg, #4388e6, #62c5c2);
}

/* 顶部主视觉：让 FLUX 图更突出，文字区保持清晰 */
.header {
  min-height: 270px;
  padding: 48px 54px;
  border: 1px solid rgba(255, 255, 255, 0.9);
  border-radius: 28px;
  background:
    linear-gradient(
      90deg,
      rgba(255, 255, 255, 1) 0%,
      rgba(255, 255, 255, 0.97) 34%,
      rgba(255, 255, 255, 0.72) 54%,
      rgba(255, 255, 255, 0.04) 100%
    ),
    url("prtsc/header.png") right center / cover no-repeat,
    #fff;
  box-shadow: 0 18px 42px rgba(37, 69, 112, 0.09);
}

.header h1 {
  position: relative;
  z-index: 1;
  color: #1e3b5d;
  letter-spacing: -0.035em;
}

.header p {
  position: relative;
  z-index: 1;
  max-width: 620px;
  color: #647990;
  font-size: 17px;
}

/* 区块标题使用统一的蓝绿标记 */
.section-title {
  display: flex;
  align-items: center;
  gap: 12px;
  color: #294968;
}

.section-title::before {
  content: "";
  width: 4px;
  height: 25px;
  flex: 0 0 4px;
  border-radius: 4px;
  background: linear-gradient(180deg, #4387d6, #52b6ae);
}

/* 路线卡片增加轻色面和悬停反馈 */
.roadmap-card {
  position: relative;
  overflow: hidden;
  min-height: 138px;
  border: 1px solid #e2eaf3;
  background:
    radial-gradient(circle at 100% 0%, rgba(79, 146, 220, 0.11), transparent 45%),
    #fff;
  box-shadow: 0 7px 22px rgba(37, 69, 112, 0.045);
  transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
}

.roadmap-card:nth-child(4n + 2) {
  background:
    radial-gradient(circle at 100% 0%, rgba(67, 169, 164, 0.12), transparent 45%),
    #fff;
}

.roadmap-card:nth-child(4n + 3) {
  background:
    radial-gradient(circle at 100% 0%, rgba(137, 119, 205, 0.11), transparent 45%),
    #fff;
}

.roadmap-card:nth-child(4n) {
  background:
    radial-gradient(circle at 100% 0%, rgba(86, 159, 205, 0.12), transparent 45%),
    #fff;
}

.roadmap-card:hover {
  transform: translateY(-4px);
  border-color: #c7d9ed;
  box-shadow: 0 16px 34px rgba(37, 69, 112, 0.11);
}

/* 日记卡片突出 Day 编号，卡片边缘更轻 */
.day-card {
  position: relative;
  overflow: hidden;
  border: 1px solid #e4ebf3;
  border-radius: 17px;
  background: linear-gradient(145deg, #fff 58%, #f3f8ff 100%);
  box-shadow: 0 5px 18px rgba(37, 69, 112, 0.04);
}

.day-card::before {
  content: "";
  position: absolute;
  inset: 16px auto 16px 0;
  width: 3px;
  border-radius: 0 3px 3px 0;
  background: linear-gradient(180deg, #4387d6, #52b6ae);
  opacity: 0.65;
}

.day-card strong {
  color: #2e6fbd;
}

.day-card:hover {
  transform: translateY(-3px);
  border-color: #c7d9ed;
  box-shadow: 0 14px 30px rgba(37, 69, 112, 0.10);
}

#searchBox {
  border-color: #dce6f1;
  box-shadow: 0 5px 16px rgba(37, 69, 112, 0.04);
}

#searchBox:focus {
  border-color: #79a8dc;
  box-shadow: 0 0 0 4px rgba(57, 120, 200, 0.11);
}

@media (max-width: 640px) {
  .header {
    min-height: 220px;
    padding: 30px 24px;
    background-position: center, 58% center, center;
  }

  .header h1 {
    max-width: 80%;
  }

  .header p {
    max-width: 82%;
    font-size: 15px;
  }
}
</style>

<script>


const list =
document.getElementById("dayList");


const searchBox =
document.getElementById("searchBox");



let allNotes=[];





// =======================
// 加载搜索索引
// =======================

function getDailyNotes(){
  return allNotes
    .filter(item => item.kind === "daily" || item.file?.startsWith("daily-study/"))
    .sort((a, b) => {
      const dayOf = item => {
        const match = item.file?.match(/day(\d+)note\.html$/i);
        return match ? Number(match[1]) : Number.MAX_SAFE_INTEGER;
      };
      return dayOf(a) - dayOf(b);
    });
}

async function loadIndex(){


    try{


        const response =
        await fetch("search-index.json");



        if(!response.ok){

            throw new Error(
                "search-index.json不存在"
            );

        }



        allNotes =
        await response.json();



       render(getDailyNotes());



    }catch(e){



        list.innerHTML=

        `
        <div class="empty">

        暂无搜索索引，请先生成 search-index.json

        </div>
        `;


    }


}







// =======================
// 获取命中摘要
// =======================

function getSummary(content,keyword){



    const index =
    content
    .toLowerCase()
    .indexOf(keyword);



    if(index===-1){

        return "";

    }



    const start =
    Math.max(
        0,
        index-40
    );



    const end =
    Math.min(
        content.length,
        index+keyword.length+80
    );



    return "..."
    +
    content.substring(start,end)
    +
    "...";


}







// =======================
// 搜索评分
// =======================

function searchScore(item,keyword){



    let score=0;



    const title =
    item.title
    .toLowerCase();



    const content =
    item.content
    .toLowerCase();





    // 标题匹配

    if(title.includes(keyword)){

        score+=100;

    }




    // 正文完整匹配

    if(content.includes(keyword)){

        score+=50;

    }




    // 出现次数增加权重

    const count =
    content
    .split(keyword)
    .length-1;



    score+=count;



    return score;


}








// =======================
// 渲染结果
// =======================

function render(data){



    if(data.length===0){


        list.innerHTML=

        `
        <div class="empty">

        没有找到相关内容

        </div>
        `;


        return;


    }





    let html="";



    data.forEach(item=>{


        html+=

        `

        <div class="day-card">


        <a href="${item.file}">


        <strong>

       ${item.label || `Day ${item.day}`}

        </strong>



        <span>

        ${item.title}

        </span>




        ${
        item.summary
        ?

        `

        <p style="
        margin-top:10px;
        font-size:13px;
        color:#777;
        line-height:1.6;
        ">

        ${item.summary}

        </p>

        `

        :

        ""

        }



        </a>


        </div>


        `;


    });



    list.innerHTML=html;


}










// =======================
// 智能全文搜索
// =======================

searchBox.addEventListener(
"input",
()=>{


    const keyword =

    searchBox.value
    .trim()
    .toLowerCase();




    // 没输入恢复全部

    if(!keyword){


       render(getDailyNotes());


        return;


    }





    const result =


    allNotes


    .map(item=>{


        return {


            ...item,


            score:

            searchScore(
                item,
                keyword
            ),



            summary:

            getSummary(
                item.content,
                keyword
            )


        };


    })




    // 过滤无结果

    .filter(item=>

        item.score>0

    )




    // 相关度排序

    .sort(

        (a,b)=>

        b.score-a.score

    );





    render(result);



});








loadIndex();



</script>
