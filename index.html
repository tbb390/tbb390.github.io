<!DOCTYPE html>

<title>个人学习成长记录</title>

<style>

*{
    box-sizing:border-box;
}


body{

    margin:0;

    padding:40px 20px;

    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Microsoft YaHei",
    sans-serif;

    background:
    linear-gradient(180deg,#f5f7fa,#ffffff);

    color:#333;

}



.container{

    max-width:1000px;

    margin:auto;

}





.header{

    background:white;

    padding:35px;

    border-radius:20px;

    margin-bottom:35px;

    box-shadow:
    0 8px 25px rgba(0,0,0,.06);

}



.header h1{

    margin:0;

    font-size:32px;

}



.header p{

    margin-top:12px;

    color:#666;

    line-height:1.7;

}





.section-title{

    font-size:24px;

    font-weight:600;

    margin:35px 0 20px;

}





/* 学习路线 */

.roadmap-grid{

    display:grid;

    grid-template-columns:
    repeat(auto-fill,minmax(220px,1fr));

    gap:20px;

}



.roadmap-card{

    background:white;

    border-radius:18px;

    padding:22px;

    text-decoration:none;

    color:#222;

    box-shadow:
    0 8px 25px rgba(0,0,0,.06);

    transition:.2s;

}



.roadmap-card:hover{

    transform:translateY(-4px);

    box-shadow:
    0 12px 30px rgba(0,0,0,.1);

}



.title{

    font-size:18px;

    font-weight:600;

    margin-bottom:10px;

}



.desc{

    font-size:14px;

    color:#666;

    line-height:1.6;

}





/* 搜索 */

#searchBox{

    width:100%;

    padding:14px 18px;

    margin-bottom:25px;

    border-radius:14px;

    border:1px solid #ddd;

    font-size:15px;

    outline:none;

    background:white;

}



#searchBox:focus{

    border-color:#888;

}





/* Day卡片 */

.day-list{

    display:grid;

    grid-template-columns:
    repeat(auto-fill,minmax(160px,1fr));

    gap:18px;

}



.day-card{

    background:white;

    border-radius:15px;

    padding:18px;

    box-shadow:
    0 6px 20px rgba(0,0,0,.05);

    transition:.2s;

}



.day-card:hover{

    transform:translateY(-4px);

    box-shadow:
    0 12px 30px rgba(0,0,0,.1);

}



.day-card a{

    text-decoration:none;

    color:#333;

}



.day-card strong{

    font-size:16px;

}



.day-card span{

    display:block;

    margin-top:8px;

    font-size:13px;

    color:#777;

    line-height:1.5;

}





.empty{

    background:white;

    padding:25px;

    border-radius:15px;

    text-align:center;

    color:#888;

}





footer{

    margin-top:50px;

    text-align:center;

    font-size:13px;

    color:#999;

}


</style>

</head>

<script>


const list =
document.getElementById("dayList");


const searchBox =
document.getElementById("searchBox");



let allNotes=[];




// 加载全文索引

async function loadIndex(){


    try{


        const response =
        await fetch("search-index.json");



        if(!response.ok){

            throw new Error();

        }



        allNotes =
        await response.json();



        render(allNotes);



    }catch(e){



        list.innerHTML=
        `

        <div class="empty">

        暂无搜索索引，请先生成 search-index.json

        </div>

        `;


    }


}







// 渲染卡片

function render(data){



    if(data.length===0){


        list.innerHTML=

        `

        <div class="empty">

        没有找到相关内容

        </div>

        `;


        return;


    }




    let html="";



    data.forEach(item=>{


        html+=`

        <div class="day-card">


        <a href="${item.file}">


        <strong>

        Day ${item.day}

        </strong>


        <span>

        ${item.title}

        </span>


        </a>


        </div>


        `;


    });



    list.innerHTML=html;


}







// 全文搜索

searchBox.addEventListener(
"input",
()=>{


    const keyword =
    searchBox.value
    .trim()
    .toLowerCase();



    if(!keyword){


        render(allNotes);


        return;


    }



    const result =
    allNotes.filter(item=>{


        const text = `

        ${item.day}

        ${item.title}

        ${item.content}

        `

        .toLowerCase();



        return text.includes(keyword);



    });



    render(result);



});







loadIndex();



</script>
