<script>


const list =
document.getElementById("dayList");


const searchBox =
document.getElementById("searchBox");



let allNotes=[];





// =======================
// 加载搜索索引
// =======================

async function loadIndex(){


    try{


        const response =
        await fetch("search-index.json");



        if(!response.ok){

            throw new Error(
                "search-index.json不存在"
            );

        }



        allNotes =
        await response.json();



        render(allNotes);



    }catch(e){



        list.innerHTML=

        `
        <div class="empty">

        暂无搜索索引，请先生成 search-index.json

        </div>
        `;


    }


}







// =======================
// 获取命中摘要
// =======================

function getSummary(content,keyword){



    const index =
    content
    .toLowerCase()
    .indexOf(keyword);



    if(index===-1){

        return "";

    }



    const start =
    Math.max(
        0,
        index-40
    );



    const end =
    Math.min(
        content.length,
        index+keyword.length+80
    );



    return "..."
    +
    content.substring(start,end)
    +
    "...";


}







// =======================
// 搜索评分
// =======================

function searchScore(item,keyword){



    let score=0;



    const title =
    item.title
    .toLowerCase();



    const content =
    item.content
    .toLowerCase();





    // 标题匹配

    if(title.includes(keyword)){

        score+=100;

    }




    // 正文完整匹配

    if(content.includes(keyword)){

        score+=50;

    }




    // 出现次数增加权重

    const count =
    content
    .split(keyword)
    .length-1;



    score+=count;



    return score;


}








// =======================
// 渲染结果
// =======================

function render(data){



    if(data.length===0){


        list.innerHTML=

        `
        <div class="empty">

        没有找到相关内容

        </div>
        `;


        return;


    }





    let html="";



    data.forEach(item=>{


        html+=

        `

        <div class="day-card">


        <a href="${item.file}">


        <strong>

        Day ${item.day}

        </strong>



        <span>

        ${item.title}

        </span>




        ${
        item.summary
        ?

        `

        <p style="
        margin-top:10px;
        font-size:13px;
        color:#777;
        line-height:1.6;
        ">

        ${item.summary}

        </p>

        `

        :

        ""

        }



        </a>


        </div>


        `;


    });



    list.innerHTML=html;


}










// =======================
// 智能全文搜索
// =======================

searchBox.addEventListener(
"input",
()=>{


    const keyword =

    searchBox.value
    .trim()
    .toLowerCase();




    // 没输入恢复全部

    if(!keyword){


        render(allNotes);


        return;


    }





    const result =


    allNotes


    .map(item=>{


        return {


            ...item,


            score:

            searchScore(
                item,
                keyword
            ),



            summary:

            getSummary(
                item.content,
                keyword
            )


        };


    })




    // 过滤无结果

    .filter(item=>

        item.score>0

    )




    // 相关度排序

    .sort(

        (a,b)=>

        b.score-a.score

    );





    render(result);



});








loadIndex();



</script>
