  <style>
    
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 40px 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #f5f7fa, #ffffff);
      color: #333;
    }
    h1 {
      text-align: center;
      margin-bottom: 30px;
      font-weight: 600;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    .day-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
    }
    .day-card {
      background: #fff;
      border-radius: 12px;
      padding: 16px 0;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
      transition: transform .2s, box-shadow .2s;
    }
    .day-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.1);
    }
    .day-card a {
      text-decoration: none;
      color: #222;
      font-size: 16px;
      font-weight: 500;
    }
    footer {
      margin-top: 40px;
      text-align: center;
      font-size: 13px;
      color: #999;
    }
    .roadmap-section {
margin-bottom: 40px;
}

.roadmap-section h2 {
text-align: center;
margin-bottom: 20px;
font-weight: 600;
}

.roadmap-grid {
display: grid;
grid-template-columns: repeat(auto-fill,minmax(220px,1fr));
gap: 18px;
margin-bottom: 30px;
}

.roadmap-card {
text-decoration: none;
background: #fff;
border-radius: 14px;
padding: 18px;
box-shadow: 0 8px 24px rgba(0,0,0,.06);
transition: all .2s;
color: #222;
}

.roadmap-card:hover {
transform: translateY(-4px);
box-shadow: 0 12px 32px rgba(0,0,0,.1);
}

.roadmap-card .title {
font-size: 17px;
font-weight: 600;
margin-bottom: 8px;
}

.roadmap-card .desc {
font-size: 13px;
color: #666;
line-height: 1.5;
}

  </style>
</head>
<body>

<div class="container">
  <div class="roadmap-section">

  <h2></h2>

  <div class="roadmap-grid">

<a href="roadmap/week-plan.html" class="roadmap-card">
  <div class="title">📅 本周计划</div>
  <div class="desc">
    近一周的学习安排
  </div>
</a>

<a href="roadmap/agent-roadmap.html" class="roadmap-card">

<a href="roadmap/network-roadmap.html" class="roadmap-card">

  </div>

</div>
<h1>📘 刷题记录</h1>
  <div class="day-list" id="dayList"></div>
</div>

<footer>
  Keep going.
</footer>

<script>
const MAX_DAYS = 366
const list = document.getElementById('dayList')

async function exists(file) {
  try {
    const res = await fetch(file, { method: 'HEAD' })
    return res.ok
  } catch {
    return false
  }
}

async function loadDays() {
  for (let i = 1; i <= MAX_DAYS; i++) {
    const file = `daily study/day${i}note.html`
    if (await exists(file)) {
      const div = document.createElement('div')
      div.className = 'day-card'
      div.innerHTML = `<a href="${file}">第 ${i} 天</a>`
      list.appendChild(div)
    }
  }
}

loadDays()
</script>

</body>
</html>
