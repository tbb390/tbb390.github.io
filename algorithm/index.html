<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f2f6fb">
  <title>算法练习 | 我的学习成长记录</title>
  <link rel="stylesheet" href="algorithm.css">
</head>
<body>
  <main class="alg-wrap">
    <header class="alg-hero">
      <div class="alg-kicker">Problem Solving / 01</div>
      <h1>算法练习</h1>
      <p>记录每一次拆解问题、验证思路和优化解法的过程。</p>
      <div class="alg-stats">
        <span class="alg-stat">练习题目：lc 704 二分查找 ，lc 875 爱吃香蕉的珂珂</span>
       
        <span class="alg-stat">专题：数组 ·二分 ·</span>
      </div>
    </header>

    <div class="alg-section-head">
      <h2>最近练习</h2>
      <span>按练习时间持续添加</span>
    </div>

    <section class="alg-grid" id="problem-list" aria-label="算法练习列表" aria-live="polite">
      <!-- 复制此卡片，修改链接、题名、难度和标签即可添加题目 -->
      <a class="alg-problem" href="day01note.html">
        <div class="alg-problem-top">
          <span class="alg-difficulty">简单</span>
          <span class="alg-stat">Day 01</span>
        </div>
        <h3>lc704 二分查找</h3>
        <p>练习日期：2026年11月22日</p>
        <div class="alg-tags"><span class="alg-tag">数组</span><span class="alg-tag">二分法</span></div>
      </a>
    </section>

    <a class="alg-back" href="../index.html">← 返回学习主页</a>
  </main>
  <script>
    async function loadAlgorithmCards() {
      const list = document.getElementById("problem-list");
      list.replaceChildren();
      try {
        const response = await fetch("algorithm-index.json");
        if (!response.ok) throw new Error("algorithm-index.json unavailable");
        const problems = await response.json();
        if (!problems.length) {
          list.textContent = "还没有添加算法题目。";
          return;
        }
        for (const problem of problems) {
          const card = document.createElement("a");
          card.className = "alg-problem";
          card.href = problem.file;
          const top = document.createElement("div");
          top.className = "alg-problem-top";
          const type = document.createElement("span");
          type.className = "alg-difficulty";
          type.textContent = "算法练习";
          const day = document.createElement("span");
          day.className = "alg-stat";
          day.textContent = `Day ${String(problem.day).padStart(2, "0")}`;
          top.append(type, day);
          const title = document.createElement("h3");
          title.textContent = problem.title;
          card.append(top, title);
          if (problem.date) {
            const date = document.createElement("p");
            date.textContent = `练习日期：${problem.date}`;
            card.append(date);
          }
          list.append(card);
        }
      } catch (error) {
        list.textContent = "题目列表暂时无法加载，请重新生成算法索引。";
      }
    }
    loadAlgorithmCards();
  </script>
</body>
</html>
